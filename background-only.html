<!DOCTYPE html>
<html lang="fa" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background — Optimized</title>
<style>
:root{
  --c-bg:#f5e3c5;--c-fg:#3d3024;--c-primary:#6b3f22;
  --c-amber:#b45309;--c-amber2:#f0b35f;
  --c-blue:#06b6d4;--c-purp:#8b5cf6;
}
.dark{
  --c-bg:#08080A;--c-fg:#e6e6e6;--c-primary:#c8956e;
  --c-amber:#fcd34d;--c-amber2:#f5b971;
  --c-blue:#22d3ee;--c-purp:#a78bfa;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--c-bg);transition:background .5s}

.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-orb{position:absolute;border-radius:50%;will-change:transform;filter:blur(60px)}
.bg-orb-1{width:300px;height:300px;top:-80px;right:-50px;background:radial-gradient(circle,var(--c-primary) 0%,transparent 70%);opacity:.3;animation:f1 8s ease-in-out infinite}
.bg-orb-2{width:260px;height:260px;top:35%;left:-60px;background:radial-gradient(circle,var(--c-amber) 0%,transparent 70%);opacity:.22;animation:f2 10s ease-in-out 2s infinite}
.bg-orb-3{width:220px;height:220px;bottom:12%;right:-40px;background:radial-gradient(circle,var(--c-primary) 0%,transparent 70%);opacity:.18;animation:f3 12s ease-in-out 4s infinite}
.bg-orb-4{width:180px;height:180px;top:55%;left:25%;background:radial-gradient(circle,var(--c-amber2) 0%,transparent 70%);opacity:.14;animation:f1 9s ease-in-out 1s infinite}
@keyframes f1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-12px,10px) scale(1.08)}}
@keyframes f2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(10px,-8px) scale(1.06)}}
@keyframes f3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-8px,-12px) scale(1.1)}}

.pcanvas{position:fixed;inset:0;z-index:1;pointer-events:none}

.ctrl{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:100}
.ctrl button{
  padding:10px 24px;border-radius:12px;
  border:1.5px solid var(--c-primary);background:color-mix(in srgb,var(--c-bg) 85%,transparent);
  backdrop-filter:blur(10px);color:var(--c-primary);font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.ctrl button:hover{background:var(--c-primary);color:#fff}

@media(prefers-reduced-motion:reduce){.bg-orb{animation:none!important}}
</style>
</head>
<body>

<div class="bg-layer">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
  <div class="bg-orb bg-orb-4"></div>
  <canvas class="pcanvas" id="cv"></canvas>
</div>

<div class="ctrl"><button onclick="toggle()">تغییر دارک / لایت</button></div>

<script>
function toggle(){document.documentElement.classList.contains('dark')?document.documentElement.classList.remove('dark'):document.documentElement.classList.add('dark')}

/* === PARTICLES WITH CONNECTION LINES ===
   Lightweight approach:
   - Cap particle count by screen size
   - Only check lines every 3rd frame (interpolation)
   - Use squared distance check (no sqrt when possible)
   - Short connection distance to reduce iterations
*/
function init(){
  const cv = document.getElementById('cv');
  if(!cv) return;
  const ctx = cv.getContext('2d');
  let w,h,dpr,parts=[],raf=null,running=false,lastT=0,frameCount=0;
  const MAX_LINK = 100; // short range = less calculations
  const LINE_EVERY = 2; // draw lines every N frames

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,2);
    w=window.innerWidth;h=window.innerHeight;
    cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
    cv.style.width=w+'px';cv.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }

  function initParts(){
    resize();
    const count=Math.min(Math.max(Math.floor((w*h)/22000),25),90);
    parts=[];
    for(let i=0;i<count;i++){
      const isStar=Math.random()<0.08;
      parts.push({
        x:Math.random()*w,y:Math.random()*h,
        ox:Math.random()*w,oy:Math.random()*h,
        vx:0,vy:0,
        size:(0.6+Math.random()*1.4)*(isStar?1.4:1),
        layer:Math.random()<0.7?0.3+Math.random()*0.3:0.6+Math.random()*0.3,
        opacity:(0.3+Math.random()*0.4),
        tw:Math.random()*Math.PI*2,
        twSpd:0.01+Math.random()*0.02,
        isStar:isStar,
        ci:Math.random()<0.55?0:Math.random()<0.85?1:2
      });
    }
  }

  function isDark(){return document.documentElement.classList.contains('dark')}
  function cols(){
    return isDark()
      ?['rgba(200,149,110,','rgba(252,211,77,','rgba(167,139,250,']
      :['rgba(107,63,34,','rgba(180,83,9,','rgba(139,92,256,'];
  }
  // Light mode multipliers (boost visibility)
  function alphaMul(){return isDark()?1:1.6}
  function lineMul(){return isDark()?1:1.8}

  function loop(){
    if(!running) return;
    if(document.hidden){raf=requestAnimationFrame(loop);return}
    const now=performance.now();
    if(lastT===0) lastT=now;
    const dt=Math.min((now-lastT)/16.67,3);
    lastT=now;
    frameCount++;

    const c=cols();
    const aM=alphaMul(), lM=lineMul();

    // Update particles
    for(let i=0;i<parts.length;i++){
      const p=parts[i];
      // Gentle drift
      const driftX=Math.sin(now*0.0003+p.tw)*15*p.layer;
      const driftY=Math.cos(now*0.00025+p.tw*1.3)*12*p.layer;
      p.vx+=(p.ox+driftX-p.x)*0.004*dt;
      p.vy+=(p.oy+driftY-p.y)*0.004*dt;
      p.vx*=0.93;p.vy*=0.93;
      p.x+=p.vx*dt;p.y+=p.vy*dt;
      p.tw+=p.twSpd*dt;
      // Wrap
      if(p.x<-20)p.x=w+20;if(p.x>w+20)p.x=-20;
      if(p.y<-20)p.y=h+20;if(p.y>h+20)p.y=-20;
    }

    ctx.clearRect(0,0,w,h);

    // Draw connection lines (every N frames for performance)
    if(frameCount%LINE_EVERY===0){
      for(let i=0;i<parts.length;i++){
        const a=parts[i];
        for(let j=i+1;j<parts.length;j++){
          const b=parts[j];
          const dx=a.x-b.x,dy=a.y-b.y;
          const d2=dx*dx+dy*dy;
          const maxD=MAX_LINK*(0.5+Math.min(a.layer,b.layer)*0.7);
          if(d2<maxD*maxD && Math.abs(a.layer-b.layer)<0.3){
            const d=Math.sqrt(d2);
            const alpha=((1-d/maxD)*0.12*Math.min(a.layer,b.layer)*lM);
            if(alpha>0.005){
              ctx.strokeStyle=c[0]+alpha+')';
              ctx.lineWidth=0.6;
              ctx.beginPath();
              ctx.moveTo(a.x,a.y);
              ctx.lineTo(b.x,b.y);
              ctx.stroke();
            }
          }
        }
      }
    }

    // Draw particles
    for(let i=0;i<parts.length;i++){
      const p=parts[i];
      const tw=0.6+0.4*Math.sin(p.tw);
      const o=Math.min(p.opacity*tw*aM,1);
      const col=c[p.ci];

      if(p.isStar && tw>0.65){
        const beam=p.size*(1.6+0.6*tw);
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tw*0.4);
        ctx.globalAlpha=o*0.6;ctx.fillStyle=col+'1)';
        ctx.fillRect(-beam,-0.3,beam*2,0.6);
        ctx.fillRect(-0.3,-beam,0.6,beam*2);
        ctx.restore();
      } else {
        ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.globalAlpha=o;ctx.fillStyle=col+'1)';ctx.fill();
      }
    }
    ctx.globalAlpha=1;
    raf=requestAnimationFrame(loop);
  }

  function start(){if(running)return;running=true;lastT=0;frameCount=0;raf=requestAnimationFrame(loop)}
  function stop(){running=false;if(raf)cancelAnimationFrame(raf)}

  initParts();start();

  let rt;
  window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(initParts,250)});
  document.addEventListener('visibilitychange',()=>{document.hidden?stop():start()});
}

window.addEventListener('DOMContentLoaded',init);
</script>
</body>
</html>
