<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobile Nav — Premium Design</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #c8956e;
    --primary-glow: rgba(200, 149, 110, 0.4);
    --amber: #fcd34d;
    --fg: #e6e6e6;
    --muted: #a1a1a1;
    --font: 'Vazirmatn', system-ui, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    background: #060608;
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* === Phone Frame === */
  .phone {
    width: 380px;
    height: 720px;
    background: #0a0a0c;
    border-radius: 40px;
    border: 2px solid rgba(255,255,255,0.08);
    overflow: hidden;
    position: relative;
    box-shadow: 0 25px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05);
  }

  /* === Background Content === */
  .phone-bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(200,149,110,0.06) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a0c 0%, #0d0d10 100%);
  }

  .phone-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(179,179,179,0.06) 1px, transparent 1px);
    background-size: 24px 24px;
    opacity: 0.5;
  }

  .phone-content {
    position: relative;
    z-index: 1;
    padding: 60px 20px 100px;
    height: 100%;
    overflow-y: auto;
  }

  .phone-title {
    font-size: 1.5rem;
    font-weight: 800;
    text-align: center;
    margin-bottom: 1rem;
    background: linear-gradient(135deg, var(--fg), var(--muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .phone-subtitle {
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 2rem;
  }

  .demo-card {
    background: rgba(20,20,23,0.6);
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 1rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }

  .demo-card h3 {
    font-size: 0.875rem;
    font-weight: 600;
    margin-bottom: 0.5rem;
  }

  .demo-card p {
    font-size: 0.7rem;
    color: var(--muted);
    line-height: 1.6;
  }

  /* === Mobile Bottom Nav === */
  .mobile-nav {
    position: absolute;
    bottom: 16px;
    left: 16px;
    right: 16px;
    z-index: 10;
  }

  .nav-container {
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 8px 12px;
    background: rgba(16, 16, 20, 0.85);
    backdrop-filter: blur(30px) saturate(1.5);
    -webkit-backdrop-filter: blur(30px) saturate(1.5);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 24px;
    box-shadow:
      0 8px 32px rgba(0,0,0,0.5),
      0 2px 8px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.04);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 8px 12px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
    text-decoration: none;
    color: var(--muted);
    position: relative;
  }

  .nav-item:hover {
    color: var(--fg);
  }

  .nav-item.active {
    color: var(--primary);
  }

  .nav-item__icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.3s;
  }

  .nav-item__icon svg {
    width: 22px;
    height: 22px;
  }

  .nav-item.active .nav-item__icon {
    transform: scale(1.1);
  }

  .nav-item__label {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.02em;
    opacity: 0.7;
    transition: opacity 0.3s;
  }

  .nav-item.active .nav-item__label {
    opacity: 1;
  }

  .nav-item--fab {
    position: relative;
    top: -20px;
  }

  .nav-item--fab .nav-item__icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary), #a06848);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 4px 16px -4px var(--primary-glow),
      0 0 20px -4px var(--primary-glow);
    transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
  }

  .nav-item--fab .nav-item__icon svg {
    width: 24px;
    height: 24px;
    color: #fff;
  }

  .nav-item--fab:hover .nav-item__icon {
    transform: scale(1.1);
    box-shadow:
      0 6px 24px -4px var(--primary-glow),
      0 0 30px -4px var(--primary-glow);
  }

  .nav-item--fab .nav-item__label {
    margin-top: 4px;
    color: var(--primary);
  }

  /* Active indicator dot */
  .nav-item.active:not(.nav-item--fab)::after {
    content: '';
    position: absolute;
    bottom: 2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary-glow);
  }

  /* === Top Bar === */
  .top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 10;
  }

  .top-bar__logo {
    font-size: 1rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--amber));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .top-bar__actions {
    display: flex;
    gap: 8px;
  }

  .top-bar__btn {
    width: 36px;
    height: 36px;
    border-radius: 12px;
    background: rgba(20,20,23,0.7);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.3s;
  }

  .top-bar__btn:hover {
    color: var(--fg);
    border-color: rgba(255,255,255,0.1);
  }

  .top-bar__btn svg {
    width: 18px;
    height: 18px;
  }

  /* === Label === */
  .section-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 1rem;
    opacity: 0.6;
    text-align: center;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="bg-phone"></div>
  <div class="phone-bg"></div>

  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar__logo">بازارگاه</div>
    <div class="top-bar__actions">
      <button class="top-bar__btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="top-bar__btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="phone-content">
    <h1 class="phone-title">بازارگاه مدرن</h1>
    <p class="phone-subtitle">نسل جدید پلتفرم‌های معامله خودرو</p>

    <div class="demo-card">
      <h3>آگهی فعال</h3>
      <p>۱۲,۴۸۰+ آگهی فعال در انتظار مشاهده شما</p>
    </div>
    <div class="demo-card">
      <h3>نماینده رسمی</h3>
      <p>۸۵۶+ نمایندگی رسمی در سراسر ایران</p>
    </div>
    <div class="demo-card">
      <h3>استان تحت پوشش</h3>
      <p>۳۱ استان با پوشش کامل خدمات</p>
    </div>
  </div>

  <!-- Mobile Bottom Nav -->
  <div class="mobile-nav">
    <div class="nav-container">
      <a href="#" class="nav-item">
        <div class="nav-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <span class="nav-item__label">خانه</span>
      </a>
      <a href="#" class="nav-item">
        <div class="nav-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <span class="nav-item__label">جستجو</span>
      </a>
      <a href="#" class="nav-item nav-item--fab">
        <div class="nav-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <span class="nav-item__label">ثبت آگهی</span>
      </a>
      <a href="#" class="nav-item">
        <div class="nav-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </div>
        <span class="nav-item__label">علاقه‌مندی</span>
      </a>
      <a href="#" class="nav-item active">
        <div class="nav-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <span class="nav-item__label">پروفایل</span>
      </a>
    </div>
  </div>
</div>

<div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); text-align: center;">
  <div class="section-label">Mobile Bottom Navigation — Glass Design</div>
</div>

</body>
</html>
