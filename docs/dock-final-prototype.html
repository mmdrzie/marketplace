<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dock — Professional Dynamic</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #c8956e;
    --primary-glow: rgba(200, 149, 110, 0.45);
    --primary-dim: rgba(200, 149, 110, 0.12);
    --amber: #fcd34d;
    --purple: #a78bfa;
    --error: #f43f5e;
    --fg: #e6e6e6;
    --muted: #a1a1a1;
    --font: 'Vazirmatn', system-ui, sans-serif;
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: transparent;
    min-height: 100vh;
  }

  /* === DOCK SYSTEM === */
  .dock-system {
    position: relative;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --smooth: cubic-bezier(0.22, 1, 0.36, 1);
  }

  /* Liquid morphing backdrop */
  .dock-backdrop {
    position: absolute;
    inset: -20px -30px;
    border-radius: 36px;
    background: rgba(14, 14, 18, 0.88);
    backdrop-filter: blur(60px) saturate(1.8) brightness(1.05);
    -webkit-backdrop-filter: blur(60px) saturate(1.8) brightness(1.05);
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.5),
      0 12px 40px rgba(0,0,0,0.7),
      0 4px 12px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.03),
      inset 0 -1px 0 rgba(0,0,0,0.3);
    transition:
      border-radius 0.5s var(--spring),
      transform 0.4s var(--spring),
      box-shadow 0.4s var(--smooth);
    overflow: hidden;
  }

  /* Animated border gradient */
  .dock-backdrop::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 37px;
    padding: 1px;
    background: conic-gradient(
      from var(--border-angle, 0deg),
      transparent 0%,
      rgba(200,149,110,0.15) 10%,
      rgba(252,211,77,0.08) 25%,
      transparent 40%,
      transparent 60%,
      rgba(167,139,250,0.1) 75%,
      rgba(200,149,110,0.15) 90%,
      transparent 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: borderRotate 8s linear infinite;
    opacity: 0.6;
    transition: opacity 0.3s;
  }

  .dock-system:hover .dock-backdrop::before {
    opacity: 1;
  }

  @property --border-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  @keyframes borderRotate {
    to { --border-angle: 360deg; }
  }

  /* Top edge highlight */
  .dock-backdrop::after {
    content: '';
    position: absolute;
    top: 0;
    left: 15%;
    right: 15%;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(255,255,255,0.12) 20%,
      rgba(200,149,110,0.25) 50%,
      rgba(255,255,255,0.12) 80%,
      transparent
    );
    opacity: 0.8;
  }

  /* === DOCK LAYOUT === */
  .dock {
    display: flex;
    align-items: flex-end;
    gap: 0;
    padding: 12px 18px;
    position: relative;
    z-index: 2;
  }

  /* === ITEM === */
  .dock-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    position: relative;
    cursor: pointer;
  }

  /* Icon wrapper with physics */
  .dock-item__wrap {
    position: relative;
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    transition:
      transform 0.4s var(--spring),
      margin 0.4s var(--spring);
    transform-origin: bottom center;
    will-change: transform;
  }

  /* Icon itself */
  .dock-item__icon {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    background: linear-gradient(155deg, rgba(32, 32, 40, 0.92) 0%, rgba(18, 18, 22, 0.98) 100%);
    border: 1px solid rgba(255,255,255,0.04);
    color: var(--muted);
    position: relative;
    overflow: hidden;
    transition: all 0.35s var(--spring);
    box-shadow:
      0 2px 6px rgba(0,0,0,0.4),
      0 1px 2px rgba(0,0,0,0.2),
      inset 0 1px 0 rgba(255,255,255,0.03),
      inset 0 -1px 0 rgba(0,0,0,0.2);
  }

  .dock-item__icon svg {
    width: 20px;
    height: 20px;
    transition: transform 0.35s var(--spring), filter 0.35s;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
  }

  /* Internal shine sweep */
  .dock-item__shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 60%;
    height: 100%;
    background: linear-gradient(
      105deg,
      transparent 0%,
      rgba(255,255,255,0.04) 40%,
      rgba(255,255,255,0.08) 50%,
      rgba(255,255,255,0.04) 60%,
      transparent 100%
    );
    transform: skewX(-15deg);
    transition: left 0.6s var(--smooth);
    pointer-events: none;
  }

  .dock-item:hover .dock-item__shine {
    left: 120%;
  }

  /* Breathing glow ring */
  .dock-item__breathe {
    position: absolute;
    inset: -6px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    background: radial-gradient(ellipse at 50% 100%, var(--primary-glow), transparent 65%) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transform: scale(0.85);
    transition: all 0.4s var(--spring);
    filter: blur(4px);
    pointer-events: none;
  }

  .dock-item:hover .dock-item__breathe {
    opacity: 1;
    transform: scale(1);
  }

  /* === MAGNIFICATION ENGINE === */
  .dock-item:hover > .dock-item__wrap {
    transform: translateY(-14px) scale(1.45);
    margin: 0 6px;
  }

  .dock-item:hover .dock-item__icon {
    background: linear-gradient(155deg, rgba(200,149,110,0.18) 0%, rgba(32, 32, 40, 0.95) 100%);
    border-color: rgba(200,149,110,0.22);
    color: var(--fg);
    box-shadow:
      0 10px 30px -6px var(--primary-glow),
      0 4px 12px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -1px 0 rgba(0,0,0,0.15);
  }

  .dock-item:hover .dock-item__icon svg {
    transform: scale(1.2);
    filter: drop-shadow(0 2px 8px rgba(200,149,110,0.4));
  }

  /* Adjacent items (1st neighbor) */
  .dock-item:hover + .dock-item > .dock-item__wrap,
  .dock-item:has(+ :hover) > .dock-item__wrap {
    transform: translateY(-8px) scale(1.18);
    margin: 0 3px;
  }

  /* 2nd neighbor */
  .dock-item:hover + .dock-item + .dock-item > .dock-item__wrap,
  .dock-item:has(+ .dock-item + :hover) > .dock-item__wrap {
    transform: translateY(-4px) scale(1.08);
    margin: 0 1px;
  }

  /* === ACTIVE STATE === */
  .dock-item.is-active .dock-item__icon {
    background: linear-gradient(155deg, rgba(200,149,110,0.2) 0%, rgba(28, 28, 35, 0.92) 100%);
    border-color: rgba(200,149,110,0.3);
    color: var(--primary);
    box-shadow:
      0 4px 16px -4px var(--primary-glow),
      0 1px 4px rgba(0,0,0,0.3),
      inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .dock-item.is-active .dock-item__icon svg {
    filter: drop-shadow(0 2px 8px var(--primary-glow));
  }

  /* Active dot with elastic entrance */
  .dock-item__dot {
    position: absolute;
    bottom: -7px;
    left: 50%;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 10px var(--primary-glow), 0 0 20px rgba(200,149,110,0.2);
    transform: translateX(-50%) scale(0);
    transition: transform 0.35s var(--spring);
  }

  .dock-item.is-active .dock-item__dot {
    transform: translateX(-50%) scale(1);
  }

  /* === LABEL === */
  .dock-item__label {
    font-size: 10px;
    font-weight: 500;
    color: rgba(161,161,161,0.45);
    text-align: center;
    width: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: all 0.3s var(--smooth);
    letter-spacing: 0.02em;
  }

  .dock-item:hover .dock-item__label {
    color: var(--fg);
    transform: translateY(1px);
  }

  .dock-item.is-active .dock-item__label {
    color: var(--primary);
    font-weight: 600;
  }

  /* === TOOLTIP === */
  .dock-item__tip {
    position: absolute;
    bottom: calc(100% + 18px);
    left: 50%;
    padding: 7px 14px;
    background: rgba(16, 16, 20, 0.97);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    color: var(--fg);
    white-space: nowrap;
    box-shadow:
      0 12px 32px rgba(0,0,0,0.7),
      0 4px 12px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.03);
    transform: translateX(-50%) translateY(10px) scale(0.85);
    opacity: 0;
    pointer-events: none;
    transition: all 0.28s var(--spring);
    z-index: 100;
  }

  .dock-item__tip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: rgba(16, 16, 20, 0.97);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
  }

  .dock-item:hover .dock-item__tip {
    transform: translateX(-50%) translateY(0) scale(1);
    opacity: 1;
  }

  /* === SEPARATOR with pulse === */
  .dock-sep {
    width: 1px;
    height: 36px;
    margin: 0 8px;
    position: relative;
    align-self: center;
  }

  .dock-sep::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      transparent,
      rgba(255,255,255,0.07) 25%,
      rgba(200,149,110,0.15) 50%,
      rgba(255,255,255,0.07) 75%,
      transparent
    );
    animation: sepPulse 4s ease-in-out infinite;
  }

  @keyframes sepPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* === SPECIAL: THEME === */
  .dock-item--theme .dock-item__icon {
    background: linear-gradient(155deg, rgba(252,211,77,0.06) 0%, rgba(18,18,22,0.95) 100%);
  }

  .dock-item--theme .dock-item__icon svg { color: var(--amber); }

  .dock-item--theme:hover .dock-item__icon {
    background: linear-gradient(155deg, rgba(252,211,77,0.15) 0%, rgba(32,32,40,0.95) 100%);
    border-color: rgba(252,211,77,0.25);
    box-shadow: 0 10px 30px -6px rgba(252,211,77,0.2);
  }

  .dock-item--theme .dock-item__breathe {
    background: radial-gradient(ellipse at 50% 100%, rgba(252,211,77,0.25), transparent 65%) border-box;
  }

  /* === SPECIAL: QUICK ACCESS === */
  .dock-item--quick .dock-item__icon {
    background: linear-gradient(155deg, rgba(167,139,250,0.06) 0%, rgba(18,18,22,0.95) 100%);
  }

  .dock-item--quick .dock-item__icon svg { color: var(--purple); }

  .dock-item--quick:hover .dock-item__icon {
    background: linear-gradient(155deg, rgba(167,139,250,0.15) 0%, rgba(32,32,40,0.95) 100%);
    border-color: rgba(167,139,250,0.25);
    box-shadow: 0 10px 30px -6px rgba(167,139,250,0.2);
  }

  .dock-item--quick .dock-item__breathe {
    background: radial-gradient(ellipse at 50% 100%, rgba(167,139,250,0.25), transparent 65%) border-box;
  }

  /* === USER AVATAR === */
  .dock-item__avatar {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--primary), #9a6848 40%, var(--primary) 80%);
    background-size: 200% 200%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
    border: 2px solid rgba(200,149,110,0.3);
    transition: all 0.4s var(--spring);
    cursor: pointer;
    position: relative;
    box-shadow:
      0 4px 14px -3px var(--primary-glow),
      inset 0 1px 0 rgba(255,255,255,0.15),
      inset 0 -1px 0 rgba(0,0,0,0.15);
    animation: avatarShimmer 5s ease-in-out infinite;
  }

  @keyframes avatarShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .dock-item:hover .dock-item__avatar {
    transform: translateY(-14px) scale(1.45);
    box-shadow:
      0 14px 32px -4px var(--primary-glow),
      0 6px 14px rgba(0,0,0,0.5),
      inset 0 1px 0 rgba(255,255,255,0.2);
    border-color: rgba(200,149,110,0.55);
  }

  /* Status ring */
  .dock-item__avatar-ring {
    position: absolute;
    inset: -4px;
    border-radius: 17px;
    pointer-events: none;
  }

  .dock-item__avatar-ring::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 17px;
    padding: 1.5px;
    background: conic-gradient(from 0deg, var(--primary), var(--amber), var(--purple), var(--primary));
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.3;
    animation: ringSpin 5s linear infinite;
    transition: opacity 0.3s;
  }

  .dock-item:hover .dock-item__avatar-ring::before {
    opacity: 0.7;
  }

  @keyframes ringSpin {
    to { transform: rotate(360deg); }
  }

  /* Badge */
  .dock-item__badge {
    position: absolute;
    top: -5px;
    right: -5px;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--error), #d4355a);
    color: #fff;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 5px;
    box-shadow:
      0 3px 10px rgba(244,63,94,0.5),
      0 0 0 2px rgba(14,14,18,0.9);
    animation: badgeHeartbeat 1.8s ease-in-out infinite;
    z-index: 5;
  }

  @keyframes badgeHeartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.15); }
    30% { transform: scale(1); }
    45% { transform: scale(1.08); }
    60% { transform: scale(1); }
  }

  /* === CLICK RIPPLE === */
  .dock-item__ripple {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    pointer-events: none;
    overflow: hidden;
  }

  .dock-item__ripple::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,149,110,0.4), transparent 70%);
    transform: translate(-50%, -50%);
    opacity: 0;
  }

  .dock-item:active .dock-item__ripple::before {
    animation: rippleExpand 0.5s ease-out;
  }

  @keyframes rippleExpand {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 120px; height: 120px; opacity: 0; }
  }

  /* === BOTTOM TRAIL (mouse follow) === */
  .dock-trail {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 48px;
    height: 3px;
    border-radius: 3px;
    background: radial-gradient(ellipse, var(--primary-glow), transparent 70%);
    opacity: 0;
    transform: translateX(0);
    transition:
      opacity 0.3s,
      left 0.08s linear,
      width 0.2s var(--smooth);
    filter: blur(2px);
    pointer-events: none;
    z-index: 1;
  }

  .dock-system:hover .dock-trail {
    opacity: 0.9;
  }

  /* === ELASTIC SQUASH on press === */
  .dock-item:active > .dock-item__wrap {
    transition: transform 0.15s ease-out;
  }

  .dock-item:active:nth-child(odd) > .dock-item__wrap {
    transform: translateY(-8px) scaleX(1.15) scaleY(0.9);
  }

  .dock-item:active:nth-child(even) > .dock-item__wrap {
    transform: translateY(-8px) scaleX(0.9) scaleY(1.1);
  }

  /* === WAVE PROPAGATION (on active change) === */
  .dock-wave {
    position: absolute;
    bottom: 8px;
    left: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--primary);
    transform: translateX(-50%) scale(0);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
  }

  .dock-item.is-active .dock-wave {
    animation: waveExpand 0.6s ease-out;
  }

  @keyframes waveExpand {
    0% { transform: translateX(-50%) scale(0); opacity: 0.6; }
    100% { transform: translateX(-50%) scale(25); opacity: 0; }
  }

  /* === RESPONSIVE === */
  @media (max-width: 700px) {
    .dock { padding: 8px 10px; }
    .dock-item__wrap { width: 40px; height: 40px; border-radius: 11px; }
    .dock-item__icon { border-radius: 11px; }
    .dock-item__icon svg { width: 17px; height: 17px; }
    .dock-item__label { display: none; }
    .dock-item__tip { display: none; }
    .dock-item__avatar { width: 40px; height: 40px; border-radius: 11px; font-size: 13px; }
    .dock-item:hover > .dock-item__wrap { transform: translateY(-10px) scale(1.3); }
    .dock-item:hover .dock-item__avatar { transform: translateY(-10px) scale(1.3); }
    .dock-sep { margin: 0 4px; }
  }
</style>
</head>
<body>

<div class="dock-system" id="dockSystem">
  <div class="dock-backdrop"></div>
  <div class="dock" id="dock">

    <!-- Mouse-following trail -->
    <div class="dock-trail" id="trail"></div>

    <!-- Home -->
    <div class="dock-item">
      <div class="dock-item__tip">صفحه اصلی</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">صفحه اصلی</span>
    </div>

    <!-- Listings -->
    <div class="dock-item is-active">
      <div class="dock-item__tip">آگهی‌ها</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">آگهی‌ها</span>
    </div>

    <!-- News -->
    <div class="dock-item">
      <div class="dock-item__tip">اخبار بازار</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">اخبار</span>
    </div>

    <!-- Encyclopedia -->
    <div class="dock-item">
      <div class="dock-item__tip">دانشنامه</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M20 13.5V6a2 2 0 00-2-2H6a2 2 0 00-2 2v13"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">دانشنامه</span>
    </div>

    <!-- Categories -->
    <div class="dock-item">
      <div class="dock-item__tip">دسته‌بندی‌ها</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">دسته‌بندی</span>
    </div>

    <!-- Separator -->
    <div class="dock-sep" aria-hidden="true"></div>

    <!-- Dashboard -->
    <div class="dock-item">
      <div class="dock-item__tip">داشبورد</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">داشبورد</span>
    </div>

    <!-- Quick Access -->
    <div class="dock-item dock-item--quick">
      <div class="dock-item__tip">دسترسی سریع ⌘K</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">سریع</span>
    </div>

    <!-- Separator -->
    <div class="dock-sep" aria-hidden="true"></div>

    <!-- Theme Toggle -->
    <div class="dock-item dock-item--theme">
      <div class="dock-item__tip">تغییر تم</div>
      <div class="dock-item__wrap">
        <div class="dock-item__breathe"></div>
        <div class="dock-item__icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <div class="dock-item__shine"></div>
          <div class="dock-item__ripple"></div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">تم</span>
    </div>

    <!-- User -->
    <div class="dock-item">
      <div class="dock-item__tip">علی رضایی — نمایندگی</div>
      <div class="dock-item__wrap">
        <div class="dock-item__avatar-ring"></div>
        <div class="dock-item__avatar">
          ع
          <div class="dock-item__badge">۳</div>
        </div>
        <div class="dock-item__dot"></div>
        <div class="dock-wave"></div>
      </div>
      <span class="dock-item__label">کاربر</span>
    </div>

  </div>
</div>

<script>
  const dock = document.getElementById('dock');
  const trail = document.getElementById('trail');
  const items = dock.querySelectorAll('.dock-item');

  // Mouse-following trail
  dock.addEventListener('mousemove', (e) => {
    const rect = dock.getBoundingClientRect();
    const x = e.clientX - rect.left;
    trail.style.left = (x - 24) + 'px';
    trail.style.opacity = '0.9';
  });

  dock.addEventListener('mouseleave', () => {
    trail.style.opacity = '0';
  });

  // Click: switch active + elastic feedback
  items.forEach((item, index) => {
    item.addEventListener('click', function() {
      if (this.classList.contains('dock-item--theme')) {
        // Theme toggle bounce
        this.style.transform = 'rotate(180deg) scale(0.8)';
        setTimeout(() => { this.style.transform = ''; }, 300);
        return;
      }

      items.forEach(i => i.classList.remove('is-active'));
      this.classList.add('is-active');

      // Elastic squash
      const wrap = this.querySelector('.dock-item__wrap');
      const direction = index % 2 === 0 ? 'scaleX(1.2) scaleY(0.88)' : 'scaleX(0.88) scaleY(1.2)';
      wrap.style.transition = 'transform 0.12s ease-out';
      wrap.style.transform = `translateY(-10px) ${direction}`;
      requestAnimationFrame(() => {
        setTimeout(() => {
          wrap.style.transform = '';
          wrap.style.transition = '';
        }, 120);
      });
    });
  });

  // Keyboard: Ctrl+K opens quick access animation
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
      e.preventDefault();
      const quick = document.querySelector('.dock-item--quick .dock-item__wrap');
      quick.style.transition = 'transform 0.15s ease-out';
      quick.style.transform = 'translateY(-20px) scale(1.5)';
      setTimeout(() => {
        quick.style.transform = '';
        setTimeout(() => { quick.style.transition = ''; }, 400);
      }, 150);
    }
  });

  // Idle breathing for active dot
  function breathe() {
    document.querySelectorAll('.dock-item.is-active .dock-item__dot').forEach(dot => {
      dot.animate([
        { transform: 'translateX(-50%) scale(1)', boxShadow: '0 0 10px var(--primary-glow)' },
        { transform: 'translateX(-50%) scale(1.3)', boxShadow: '0 0 18px var(--primary-glow)' },
        { transform: 'translateX(-50%) scale(1)', boxShadow: '0 0 10px var(--primary-glow)' }
      ], { duration: 2000, iterations: Infinity, easing: 'ease-in-out' });
    });
  }
  breathe();
</script>

</body>
</html>
